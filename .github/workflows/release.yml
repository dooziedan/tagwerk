# Creates the GitHub Release page for a version, with that version's CHANGELOG.md section as
# its notes (scripts/release_notes.py). The image itself comes from docker.yml.
#   tag v1.2.3 pushed         -> Release "Tagwerk 1.2.3"
#   run by hand (Actions tab) -> create or refresh the Release of a tag that already exists
name: Release page

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag, e.g. v0.18.2"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - name: Notes from CHANGELOG.md
        run: python3 scripts/release_notes.py "$TAG" > notes.md
      - name: Create or update the Release
        run: |
          # Only the highest version is marked "Latest", also when an older tag is run by hand.
          newest=$(git ls-remote --tags --refs origin | sed 's#.*refs/tags/##' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          latest=$([ "$TAG" = "$newest" ] && echo true || echo false)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "Tagwerk ${TAG#v}" --notes-file notes.md --latest="$latest"
          else
            gh release create "$TAG" --verify-tag --title "Tagwerk ${TAG#v}" --notes-file notes.md --latest="$latest"
          fi
