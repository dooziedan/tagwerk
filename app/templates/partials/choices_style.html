{# Key notation (wizard step "Keys"; also in Settings). #}
<fieldset>
  <legend><strong>How should keys be shown?</strong></legend>
  {% for value, label in notations.items() %}
  <label><input type="radio" name="key_notation" value="{{ value }}" {% if prefs.key_notation == value %}checked{% endif %}> {{ label }}</label>
  {% endfor %}
  <small class="muted">Only how Tagwerk shows keys. Keys written into files always use standard notation (Am, F#), which every program reads.</small>
</fieldset>
