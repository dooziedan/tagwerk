[project]
name = "tagwerk"
version = "0.10.0"
description = "Self-hosted music library manager: dashboard, tag editing, MusicBrainz lookup and Navidrome integration."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pydantic-settings>=2.6",
    "mutagen>=1.47",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "python-multipart>=0.0.18",
    # BPM and key from the audio (app/audio_analysis.py). Pinned: a beta with no stable
    # release for current Python; newer builds may change results.
    "essentia==2.1b6.dev1438",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "pre-commit>=4.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
    "templates/*.html",
    "templates/partials/*.html",
    "static/*",
    "static/fonts/*",
    "migrations/*.py",
    "migrations/*.mako",
    "migrations/versions/*.py",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# SIM300 flags `ALBUM_ARTIST == value` as a "Yoda condition", but module-level SQL
# expressions in capitals are normal here.
ignore = ["SIM300"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
